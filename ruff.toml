# Phase 0 – Step 3: ruff (linter) configuration
target-version = "py311"
line-length = 100

[lint]
# E: pycodestyle errors, F: pyflakes, I: import order, B: bugbear, UP: pyupgrade
select = ["E", "F", "I", "B", "UP"]

[lint.per-file-ignores]
# Mock data has long human-written descriptions.
"data/data.py" = ["E501"]
# TEMPORARY: remove in Phase 2 – Step 1 (models.py comment cleanup + modern types).
"agentsville/models.py" = ["E501", "I001", "UP006", "UP007", "UP035"]
