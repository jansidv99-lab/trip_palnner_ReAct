# Phase 7 – Step 8: Layer B eval job – replay the committed cassettes and prove repeatability.
# Phase 8 – Step 9: + judge calibration replay and the B1 threshold report.
# No secrets and no LLM cost: every response comes from evals/cassettes/. Informational for now;
# B4 (Phase 11) adds thresholds/baselines and makes it a required check.
# Phase 13 – Step 5: also callable from deploy.yml (workflow_call). A call ignores the path filter
# below, so every deploy is gated by the replay – even for doc-only commits.
name: Evals

on:
  pull_request:
    branches: [main]
    paths: ["agentsville/**", "prompts/**", "evals/**", "data/**", "scripts/run_experiment.py", "scripts/calibrate_judge.py",
            ".github/workflows/eval-gate.yml"]
  push:
    branches: [main]
    paths: ["agentsville/**", "prompts/**", "evals/**", "data/**", "scripts/run_experiment.py", "scripts/calibrate_judge.py",
            ".github/workflows/eval-gate.yml"]
  workflow_dispatch:
  workflow_call: # Phase 13 – Step 5: reused as the deploy gate

permissions:
  contents: read

# Phase 13 – Step 5: "evals-" prefix keeps this group apart from CI's when both are called by deploy
concurrency:
  group: evals-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 7 – Step 8: same inputs → same numbers (reported as "Evals / eval-replay")
  eval-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # Fails with exit 2 on a cassette miss (prompt/agent changed → re-record) and exit 3 if
      # replayed results differ from the recorded expected_results.jsonl.
      - name: Replay golden v1.0.0 and check repeatability
        run: python scripts/run_experiment.py --mode replay --check-expected --out experiments/ci

      # Phase 8 – Step 9: the reasons judge must reproduce its committed calibration report
      - name: Replay judge calibration (B1)
        run: python scripts/calibrate_judge.py --mode replay --check-expected

      # Phase 8 – Step 9: threshold verdicts are shown, not yet blocking (B4 makes them required)
      - name: Thresholds report (informational until B4)
        continue-on-error: true
        run: python scripts/run_experiment.py --mode replay --check-thresholds --out experiments/ci

      - name: Upload experiment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-replay-report
          path: experiments/ci/
          if-no-files-found: ignore
