# Phase 1 – Step 1: CI – lint and unit tests (Layer A) on every PR and push to main.
# No secrets are used: `llm`-marked tests are skipped by pytest.ini, unit tests use fakes.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: # manual "Run workflow" button in the Actions tab

# Least privilege: CI only reads the code.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the older, now-stale run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Phase 1 – Step 1: static checks with ruff (reported as "CI / lint")
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # Install only ruff, at the exact version pinned in requirements-dev.txt.
      - name: Install ruff
        run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"

      # --output-format=github turns lint errors into inline PR annotations.
      - name: Lint
        run: ruff check . --output-format=github

  # Phase 1 – Step 1: unit tests with pytest (reported as "CI / test")
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: pytest -q
