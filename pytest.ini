# Phase 0 – Step 3: pytest configuration
[pytest]
testpaths = tests
# Resolve `agentsville` and `data` imports from the repo root.
pythonpath = .
markers =
    llm: calls the real LLM (slow, costs money, needs OPENAI_API_KEY)
# Paid/slow tests never run by accident; opt in with `pytest -m llm`.
addopts = -m "not llm"
