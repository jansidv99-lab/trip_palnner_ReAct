# Phase 8 – Step 7: quality thresholds. Rules: max_<metric> (value ≤ limit) or min_<metric> (≥).
# Reported by `run_experiment.py --check-thresholds`; informational until B4 (Phase 11) makes them
# blocking. Values are set from measured evidence – see plan/08-b1-grounding/b1-findings.md.

[b1]
# Data grounding – measured on 36 live runs (golden v1.0.0, gpt-4o-mini, prompt v1):
# activity 1.0% [0–5%], plan 3.6% [1–18%], trajectory 0.6% [0–3%], reason references 7.9% [4–14%]
max_activity_hallucination_rate = 0.05
max_plan_hallucination_rate = 0.10
max_trajectory_ungrounded_rate = 0.05
max_reason_reference_error_rate = 0.10
# Claim grounding – measured 19.3% [13–27%]. Set as a REGRESSION GUARD just above today's upper
# CI (owner decision): it accepts the current level and catches it getting worse. Tighten it when
# B4's prompt v2 lowers the rate.
max_ungrounded_reason_rate = 0.25
# Judge trust bar – calibration v1.0.0: precision 1.00, recall 1.00, kappa 1.00 (32 reasons)
min_judge_recall = 0.90
min_judge_precision = 0.80

# Phase 9 – Step 6: constraint compliance & goal completion. Measured on 36 live runs (golden
# v1.0.0, gpt-4o-mini, prompt v1) – see plan/09-b2-constraints/b2-findings.md §5 (owner-approved).
[b2]
# Targets: today 0 violations in 28 plans [0–12%]; these constraints must stay ~0.
max_city_dates_violation_rate = 0.05
max_budget_violation_rate = 0.05
max_overlap_violation_rate = 0.05
max_weather_label_violation_rate = 0.05
# Regression guard: measured 3.6% [1–18%] (1/28).
max_cost_accuracy_violation_rate = 0.10
# Regression guard: measured 72.2% [56–84%] live, 66.7% on the B0 recording CI replays.
# Raise it when B4 fixes the cost loops (7 of 10 failures).
min_goal_completion_rate = 0.60
# Judge trust bar: weather judge vs human labels, measured 100% [89–100%] (30/30).
min_weather_judge_agreement = 0.90

# Phase 10 – Step 8: relevancy & reasoning. Measured on 36 live runs (golden v1.0.0, gpt-4o-mini,
# prompt v1) and the B0 recording CI replays – see plan/10-b3-relevancy-reasoning/b3-findings.md §6
# (owner-approved). Every value passes on the B0 recording.
[b3]
# Targets: near-perfect today.
min_interest_coverage = 0.90  # live 97.6% [88–100%], B0 100%
min_weather_lookup_coverage = 0.95  # live 98.6% [92–100%], B0 100%
# Regression guards just below today's level.
min_relevant_rate = 0.80  # live 93.6% [83–98%], B0 100%
min_verified_before_final_rate = 0.85  # live 92.9% [77–98%], B0 100%
# Deliberately loose: the B0 recording is at 50% (a 0.70 target would fail CI). Raise after B4
# computes total_cost in code.
min_calculator_faithfulness = 0.45  # live 80.0% [61–91%], B0 50%
min_faithfulness = 0.45  # live 76.0% [57–89%], B0 50%
max_thought_action_inconsistency = 0.20  # live 15.8% [13–19%] (a lower bound), B0 11.0%
max_redundant_call_rate = 0.15  # live 9.2% [6–13%], B0 8.1%
max_error_step_rate = 0.15  # live 9.4% [7–12%], B0 9.7%
# Judge trust bars (calibration). Relevancy: 25/25 exact, weighted kappa 1.00 (optimistic – tuned
# on its own set). Thought↔action: precision 0.94, recall 0.83 – below B1's 0.90 recall by decision.
min_relevancy_judge_qwk = 0.80
min_thought_action_judge_recall = 0.80
min_thought_action_judge_precision = 0.85
